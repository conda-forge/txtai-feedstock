schema_version: 1

context:
  name: txtai
  version: "9.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/txtai-${{ version }}.tar.gz
  sha256: 7d3696eb9b929bf5c065a5d6d676794d3211b82b6d12f44552c298eec4af2139

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - faiss-cpu >=1.7.1.post2
    - huggingface_hub >=0.34.0
    - msgpack-python >=1.0.7
    - numpy >=1.18.4
    - regex >=2022.8.17
    - pyyaml >=5.3
    - safetensors >=0.4.5
    - pytorch >=2.4
    - transformers >=5.9.0
    # Try
    - accelerate
    - tqdm >=4.67.0

tests:
  - python:
      imports:
        - txtai
      # turn off pip check as it does not work with faiss-cpu
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Build AI-powered semantic search applications
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://neuml.github.io/txtai
  repository: https://github.com/neuml/txtai

extra:
  recipe-maintainers:
    - thewchan
